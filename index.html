<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A44;
    --ink-soft:#3C4A66;
    --paper:#F5F3EE;
    --card:#FFFFFF;
    --gold:#B8842E;
    --gold-soft:#F3E6CC;
    --teal:#2C6E68;
    --teal-soft:#DCEBE8;
    --line:#D8D3C8;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Sans 3', system-ui, -apple-system, sans-serif;
    font-size:19px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 40px;
  }
  .app{width:100%;max-width:640px;}

  header.top{
    text-align:center;
    margin-bottom:18px;
  }
  header.top h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:30px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header.top .range{
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }

  .progress{
    display:flex;
    align-items:center;
    gap:10px;
    margin:16px 0 20px;
  }
  .progress .track{
    flex:1;
    height:8px;
    background:var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .progress .fill{
    height:100%;
    background:var(--gold);
    border-radius:6px;
    transition:width .25s ease;
  }
  .progress .label{
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    font-weight:700;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  /* Ticket-stub card */
  .ticket{
    display:flex;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 2px 4px rgba(30,42,68,0.06), 0 8px 24px rgba(30,42,68,0.08);
    overflow:hidden;
    position:relative;
  }
  .stub{
    background:var(--ink);
    color:#fff;
    padding:26px 18px;
    width:150px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
  }
  .stub .daynum-label{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#C9D2E0;
    margin-bottom:6px;
  }
  .stub .daynum{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:56px;
    line-height:1;
  }
  .stub .weekday{
    font-family:'Source Sans 3', sans-serif;
    font-weight:600;
    font-size:17px;
    margin-top:10px;
  }
  .stub .datestr{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    color:#C9D2E0;
    margin-top:2px;
  }
  .stub .today-badge{
    margin-top:14px;
    background:var(--gold);
    color:#26170a;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.08em;
    padding:4px 10px;
    border-radius:20px;
    text-transform:uppercase;
  }

  .perforation{
    width:0;
    border-left:2px dashed var(--line);
    position:relative;
    flex-shrink:0;
  }
  .perforation::before, .perforation::after{
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    background:var(--paper);
    border-radius:50%;
    left:-11px;
  }
  .perforation::before{ top:-10px; }
  .perforation::after{ bottom:-10px; }

  .content{
    flex:1;
    padding:24px 22px 26px;
    min-width:0;
  }
  .content .city{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:26px;
    color:var(--ink);
    margin:0 0 10px;
  }
  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
  }
  .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    font-weight:700;
    padding:5px 11px;
    border-radius:8px;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .tag.transit{ background:var(--teal-soft); color:var(--teal); }
  .tag.checkin{ background:var(--gold-soft); color:var(--gold); }

  .block{
    margin-top:18px;
  }
  .block-label{

    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);

    line-height:1.5;

    width:8px;
    height:8px;
    border-radius:50%;

    color:#fff;

  }

  }

    text-align:center;
    margin-top:22px;
    font-size:14px;

  }

/* ---------- App logic ---------- */
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function parseLocalDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d);
}
function todayDateString(){
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}
function findTodayIndex(){
  const todayStr = todayDateString();
  const idx = TRIP.findIndex(day => day.d === todayStr);
  return idx; // -1 if trip hasn't started / already ended
}

let currentIndex = 0;

function loadInitialIndex(){
  const todayIdx = findTodayIndex();
  const savedDate = localStorage.getItem('jk_trip_lastOpenedDate');
  const savedIndex = localStorage.getItem('jk_trip_lastIndex');
  const deviceToday = todayDateString();

  if (todayIdx !== -1) {
    if (savedDate === deviceToday && savedIndex !== null) {
      // Already opened the app today — respect manual navigation within the same day
      return parseInt(savedIndex, 10);
    }
    // New calendar day since last open — snap to today's card
    return todayIdx;
  }
  // Trip not currently active (before or after) — use last saved position, or start at day 1
  if (savedIndex !== null) return parseInt(savedIndex, 10);
  return 0;
}

function saveIndex(idx){
  localStorage.setItem('jk_trip_lastIndex', String(idx));
  localStorage.setItem('jk_trip_lastOpenedDate', todayDateString());
}

function render(){
  const day = TRIP[currentIndex];
  const date = parseLocalDate(day.d);
  const todayIdx = findTodayIndex();
  const isToday = currentIndex === todayIdx;

  document.getElementById('stubDayNum').textContent = currentIndex + 1;
  document.getElementById('stubWeekday').textContent = WEEKDAYS[date.getDay()];
  document.getElementById('stubDate').textContent = `${MONTHS[date.getMonth()]} ${date.getDate()}`;
  document.getElementById('todayBadge').style.display = isToday ? 'inline-block' : 'none';

  document.getElementById('cityName').textContent = day.sleep;

  document.getElementById('progressLabel').textContent = `DAY ${currentIndex+1}/${TRIP.length}`;
  document.getElementById('progressFill').style.width = `${((currentIndex+1)/TRIP.length)*100}%`;

  // Tags
  const tagRow = document.getElementById('tagRow');
  tagRow.innerHTML = '';
  if (day.transit){
    const t = document.createElement('span');
    t.className = 'tag transit';
    t.textContent = day.transit.time ? `${day.transit.type} · ${day.transit.time}` : day.transit.type;
    tagRow.appendChild(t);
  }
  if (day.hotel){
    const c = document.createElement('span');
    c.className = 'tag checkin';
    c.textContent = 'New check-in tonight';
    tagRow.appendChild(c);
  }

  // Hotel block
  const hotelBlock = document.getElementById('hotelBlock');
  if (day.hotel){
    hotelBlock.style.display = 'block';
    document.getElementById('hotelText').textContent = day.hotel;
  } else {
    hotelBlock.style.display = 'none';
  }

  // Activities
  const list = document.getElementById('activityList');
  list.innerHTML = '';
  day.act.forEach(item => {
    const li = document.createElement('li');
    li.textContent = item;
    list.appendChild(li);
  });

  // Meals
  document.getElementById('lunchText').textContent = day.lunch || '—';
  document.getElementById('dinnerText').textContent = day.dinner || '—';

  // Nav buttons
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex === TRIP.length - 1;

  const todayBtn = document.getElementById('todayBtn');
  if (todayIdx === -1){
    todayBtn.textContent = 'Trip not active today';
    todayBtn.classList.remove('on-today');
  } else if (isToday){
    todayBtn.textContent = "You're viewing today";
    todayBtn.classList.add('on-today');
  } else {
    todayBtn.textContent = 'Jump to Today';
    todayBtn.classList.remove('on-today');
  }

  saveIndex(currentIndex);
}

document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentIndex > 0){ currentIndex--; render(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (currentIndex < TRIP.length - 1){ currentIndex++; render(); }
});
document.getElementById('todayBtn').addEventListener('click', () => {
  const idx = findTodayIndex();
  if (idx !== -1){ currentIndex = idx; render(); }
});

currentIndex = loadInitialIndex();
render();
</script>
</body>
</html>
